<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Facts</title>
    <style>
        body{
            margin:0;
            min-height:100vh;
            background: linear-gradient(135deg, #ff9a2f, #ff6f00);
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }


    #container{
        display:flex;
        flex-direction:column;
        align-items:center;
        padding:30px;
    }

    h1{
        color:#fff;
        margin-bottom:10px;
        text-shadow:0 2px 6px rgba(0,0,0,0.3);
    }

    #text{
        background:#fff7ed;
        max-width:420px;
        width:100%;
        margin:20px 0;
        padding:20px;
        border-radius:14px;
        box-shadow:0 8px 20px rgba(0,0,0,0.25);
        color:#4a2a00;
        font-size:16px;
        line-height:1.6;
        text-align:center;
    }

    .button{
        position:relative;
        display:inline-block;
        margin-top:20px;
        cursor:pointer;
    }

    .button a{
        color:white;
        font-weight:bold;
        font-size:26px;
        text-decoration:none;
        background-color:#ff8c1a;
        display:block;
        padding:16px 36px;
        text-shadow:0 1px 0 rgba(0,0,0,0.4);

        box-shadow:
          inset 0 1px 0 #ffd4a3,
          0 8px 0 #b35600,
          0 12px 18px rgba(0,0,0,0.35);

        border-radius:8px;
    }

    .button a:hover{
        background-color:#ff7a00;
    }

    .button a:active{
        top:6px;
        background-color:#f06f00;
        box-shadow:
          inset 0 1px 0 #ffd4a3,
          0 2px 0 #b35600;
    }
</style>
```

</head>
<body>
    <div id="container">
        <h1>Random Cat Facts 🐱</h1>
        <div id="text">Click the button to load a cat fact</div>

```
    <div class="button" onclick="work()">
        <a href="javascript:void(0)">Get Fact</a>
    </div>
</div>

<script src="script.js"></script>
```

</body>
</html>
